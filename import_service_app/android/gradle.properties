org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Network resilience when Google Maven / Central TLS flakes (see settings.gradle.kts Aliyun mirrors)
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.network.retry.count=8
systemProp.org.gradle.internal.network.retry.max-backoff-time=10000
systemProp.org.gradle.internal.http.useHttp2=false
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.initial.backoff=500
# Pub cache on C:, project on D: — Kotlin incremental fails with "different roots"
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
