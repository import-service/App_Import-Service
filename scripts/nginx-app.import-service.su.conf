server {
	server_name app.import-service.su;
	charset off;
	access_log /var/www/httpd-logs/app.import-service.su.access.log;
	error_log /var/www/httpd-logs/app.import-service.su.error.log notice;

	location ^~ /.well-known/acme-challenge/ {
		default_type text/plain;
		alias /usr/local/mgr5/www/letsencrypt/;
	}

	include /etc/nginx/vhosts-includes/awstats-nginx.conf;
	include /etc/nginx/vhosts-includes/blacklist-nginx.conf;
	include /etc/nginx/vhosts-includes/disabled.conf;
	include /etc/nginx/vhosts-resources/app.import-service.su/*.conf;
	include /etc/nginx/users-resources/www-root/*.conf;
	root /var/www/www-root/data/www/157-22-173-7.sslip.io;
	location / {
		return 301 https://$host$request_uri;
	}
	listen 157.22.173.7:80;
}

server {
	server_name app.import-service.su;
	charset off;

	ssl_certificate /etc/letsencrypt/live/app.import-service.su/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/app.import-service.su/privkey.pem;
	ssl_ciphers EECDH:+AES256:-3DES:RSA+AES:!NULL:!RC4;
	ssl_prefer_server_ciphers on;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_dhparam /etc/ssl/certs/dhparam4096.pem;

	access_log /var/www/httpd-logs/app.import-service.su.access.log;
	error_log /var/www/httpd-logs/app.import-service.su.error.log notice;

	location ^~ /.well-known/acme-challenge/ {
		default_type text/plain;
		alias /usr/local/mgr5/www/letsencrypt/;
	}

	location /ws/ {
		proxy_pass http://127.0.0.1:3010;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 3600;
		proxy_send_timeout 3600;
	}

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Port $server_port;
	}

	include /etc/nginx/vhosts-includes/awstats-nginx.conf;
	include /etc/nginx/vhosts-includes/blacklist-nginx.conf;
	include /etc/nginx/vhosts-includes/disabled.conf;
	include /etc/nginx/vhosts-resources/app.import-service.su/*.conf;
	include /etc/nginx/users-resources/www-root/*.conf;
	root /var/www/www-root/data/www/157-22-173-7.sslip.io;
	listen 157.22.173.7:443 ssl;
}
